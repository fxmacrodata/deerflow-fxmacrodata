[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deerflow-fxmacrodata"
version = "0.1.0"
description = "Native DeerFlow macro research tools and sourced report workflow"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "deerflow-extension-api>=0.2,<0.3",
  "langchain>=1.3,<2",
  "langgraph>=1.2.9,<1.3",
  "fxmacrodata-public-client @ https://github.com/fxmacrodata/fxmacrodata-public-client/releases/download/v0.1.0/fxmacrodata_public_client-0.1.0-py3-none-any.whl#sha256=5c60ff217243ff4001f178d4fdd8c3c8ce29001ad1ea0a170ed96606f0dd07c8",
]

[project.entry-points."deerflow.extensions"]
fxmacrodata = "deerflow_fxmacrodata:install"

[project.urls]
Homepage = "https://fxmacrodata.com/?utm_source=pypi&utm_medium=referral&utm_campaign=deerflow-fxmacrodata&utm_content=homepage"
Documentation = "https://fxmacrodata.com/documentation/reference?utm_source=pypi&utm_medium=referral&utm_campaign=deerflow-fxmacrodata&utm_content=docs"

[tool.setuptools]
packages = ["deerflow_fxmacrodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
